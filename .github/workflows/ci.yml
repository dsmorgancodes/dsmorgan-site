name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dsmorgan-site .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      IMAGE: us-central1-docker.pkg.dev/dsmorgan-site/cloud-run-source-deploy/dsmorgan-site:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/538734720156/locations/global/workloadIdentityPools/github-actions/providers/dsmorgan-site
          service_account: github-deploy@dsmorgan-site.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build and publish image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy dsmorgan-site \
            --image="$IMAGE" \
            --region=us-central1 \
            --project=dsmorgan-site \
            --quiet
      - name: Check deployed health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 \
            https://dsmorgan-site-538734720156.us-central1.run.app/health \
            | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
